<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logowanie</title>
    <style>
        :root { color-scheme: light dark; }
        html[data-theme="light"] { color-scheme: light; }
        html[data-theme="dark"] { color-scheme: dark; }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
            background: Canvas;
            color: CanvasText;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-container {
            background: Canvas;
            border: 1px solid rgba(127,127,127,.25);
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(0,0,0,.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            text-align: center;
        }
        .subtitle {
            font-size: 14px;
            color: color-mix(in oklab, CanvasText 60%, transparent);
            text-align: center;
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: CanvasText;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(127,127,127,.35);
            border-radius: 8px;
            background: Canvas;
            color: CanvasText;
            font: inherit;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.1);
        }
        .error-message {
            color: #ef4444;
            font-size: 13px;
            margin-top: 8px;
            min-height: 20px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(127,127,127,.35);
            background: #60a5fa;
            color: white;
            border-color: #60a5fa;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
        }
        .btn:hover {
            background: #4a9eff;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            color: color-mix(in oklab, CanvasText 70%, transparent);
            margin-top: 24px;
        }
        .switch {
            position: relative;
            width: 40px;
            height: 22px;
            display: inline-block;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: color-mix(in oklab, CanvasText 12%, Canvas);
            border-radius: 999px;
            transition: background .2s ease;
        }
        .slider:before {
            content: "";
            position: absolute;
            height: 18px;
            width: 18px;
            left: 2px;
            top: 2px;
            background: CanvasText;
            border-radius: 50%;
            transition: transform .2s ease;
        }
        .switch input:checked + .slider {
            background: color-mix(in oklab, #60a5fa 50%, Canvas);
        }
        .switch input:checked + .slider:before {
            transform: translateX(18px);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Logowanie</h1>
        <p class="subtitle">Zaloguj się, aby uzyskać dostęp</p>
        
        <form id="login-form">
            <div class="form-group">
                <label for="username">Nazwa użytkownika</label>
                <input type="text" id="username" name="username" required autocomplete="username">
                <div class="error-message" id="username-error"></div>
            </div>
            
            <div class="form-group">
                <label for="password">Hasło</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" minlength="8">
                <div class="error-message" id="password-error"></div>
                <div class="error-message" id="general-error"></div>
            </div>
            
            <button type="submit" class="btn" id="submit-btn">Zaloguj się</button>
        </form>
        
        <div class="toggle">
            Jasny motyw
            <span class="switch">
                <input id="light-toggle" type="checkbox" />
                <span class="slider"></span>
            </span>
        </div>
    </div>

    <script>
        // Theme toggle
        document.addEventListener('DOMContentLoaded', () => {
            const toggle = document.getElementById('light-toggle');
            try {
                const saved = localStorage.getItem('theme');
                if (saved === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                    if (toggle) toggle.checked = true;
                }
            } catch {}

            if (toggle) {
                toggle.addEventListener('change', () => {
                    const isLight = toggle.checked;
                    if (isLight) {
                        document.documentElement.setAttribute('data-theme', 'light');
                        try { localStorage.setItem('theme', 'light'); } catch {}
                    } else {
                        document.documentElement.removeAttribute('data-theme');
                        try { localStorage.removeItem('theme'); } catch {}
                    }
                });
            }

            // Form submission
            const form = document.getElementById('login-form');
            const submitBtn = document.getElementById('submit-btn');
            const usernameError = document.getElementById('username-error');
            const passwordError = document.getElementById('password-error');
            const generalError = document.getElementById('general-error');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                // Clear previous errors
                usernameError.textContent = '';
                passwordError.textContent = '';
                generalError.textContent = '';

                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;

                // Validation
                let hasError = false;
                
                if (!username) {
                    usernameError.textContent = 'Nazwa użytkownika jest wymagana';
                    hasError = true;
                }

                if (!password) {
                    passwordError.textContent = 'Hasło jest wymagane';
                    hasError = true;
                } else if (password.length < 8) {
                    passwordError.textContent = 'Hasło musi mieć co najmniej 8 znaków';
                    hasError = true;
                }

                if (hasError) return;

                // Disable submit button
                submitBtn.disabled = true;
                submitBtn.textContent = 'Logowanie...';

                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(result.error || 'Błąd logowania');
                    }

                    if (result.ok) {
                        // Redirect to home page
                        window.location.href = '/';
                    } else {
                        throw new Error(result.error || 'Błąd logowania');
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    generalError.textContent = error.message || 'Błąd logowania. Spróbuj ponownie.';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Zaloguj się';
                }
            });
        });
    </script>
</body>
</html>
