<!-- Common Header Component -->
<div class="header-bar" id="common-header">
    <div class="title-wrap">
        <h1 id="page-title">Strona</h1>
        <div class="crumbs" id="page-crumbs"></div>
    </div>
    <div class="tools">
        <div id="header-extra-buttons"></div>
        <div class="date-section">
            <div class="right-date" id="date-now"></div>
            <div class="profile-menu">
                <button type="button" class="profile-btn" id="profile-btn" title="Profil">
                    <span class="profile-icon">U</span>
                    <span>Profil</span>
                </button>
                <div class="profile-dropdown" id="profile-dropdown">
                    <a href="/admin" class="profile-dropdown-item">Panel Admin</a>
                    <div class="profile-dropdown-item theme-toggle">
                        <span class="toggle-label" id="theme-label">Ciemny motyw</span>
                        <span class="switch">
                            <input id="light-toggle" type="checkbox" />
                            <span class="slider"></span>
                        </span>
                    </div>
                    <button type="button" class="profile-dropdown-item logout" id="logout-btn">Wyloguj</button>
                </div>
            </div>
        </div>
    </div>
</div>
