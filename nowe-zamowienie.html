<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nowe zamówienie - Karta Wyrobu</title>
    <!-- Motyw (ciemny/jasny) ustawiany od razu, zeby nie bylo migniecia zlego motywu -->
    <script>
        (function () {
            var theme = 'dark';
            try {
                if (localStorage.getItem('theme') === 'light') theme = 'light';
            } catch (e) {}
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        :root { color-scheme: dark; }
        html[data-theme="dark"] { color-scheme: dark; }
        html[data-theme="light"] { color-scheme: light; }
        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
            background: Canvas;
            color: CanvasText;
            padding: 20px 0 80px 0; /* Extra padding at bottom for fixed buttons */
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 16px;
        }
        /* Header styles moved to header.css */
        h1 {
            font-size: 24px;
        }
        .card {
            background: Canvas;
            color: CanvasText;
            border: 1px solid rgba(127,127,127,.25);
            border-radius: 12px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08);
            padding: 24px;
            margin-bottom: 24px;
        }
        .form-section {
            margin-bottom: 32px;
        }
        .form-section:last-child {
            margin-bottom: 0;
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid color-mix(in oklab, CanvasText 20%, transparent);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group:last-child {
            margin-bottom: 0;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: CanvasText;
        }
        label .required {
            color: #ef4444;
            margin-left: 4px;
        }
        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid rgba(127,127,127,.35);
            border-radius: 8px;
            background: Canvas;
            color: CanvasText;
            font: inherit;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.1);
        }
        input[readonly] {
            background: color-mix(in oklab, CanvasText 5%, Canvas);
            cursor: not-allowed;
        }
        textarea {
            min-height: 80px;
            resize: vertical;
            font-family: inherit;
        }
        .radio-group,
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .radio-option,
        .checkbox-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        input[type="radio"],
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .form-actions-fixed {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background: Canvas;
            border-top: 1px solid rgba(127,127,127,.25);
            box-shadow: 0 -2px 8px rgba(0,0,0,.1);
            z-index: 1000;
        }
        
        .btn {
            appearance: none;
            border: 1px solid rgba(127,127,127,.35);
            background: color-mix(in oklab, Canvas 96%, transparent);
            color: CanvasText;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: color-mix(in oklab, Canvas 92%, transparent);
        }
        .btn-primary {
            background: #60a5fa;
            color: white;
            border-color: #60a5fa;
        }
        .btn-primary:hover {
            background: #4a9eff;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .toast {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: 16px;
            background: color-mix(in oklab, CanvasText 5%, Canvas);
            color: CanvasText;
            border: 1px solid rgba(127,127,127,.3);
            padding: 12px 18px;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(0,0,0,.15);
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s ease;
            font-size: 14px;
            z-index: 1000;
        }
        .toast.show {
            opacity: 1;
        }
        .toast.error {
            background: color-mix(in oklab, #ef4444 10%, Canvas);
            border-color: #ef4444;
            color: #ef4444;
        }
        .toast.success {
            background: color-mix(in oklab, #10b981 10%, Canvas);
            border-color: #10b981;
            color: #10b981;
        }
        .toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: color-mix(in oklab, CanvasText 70%, transparent);
        }
        .switch {
            position: relative;
            width: 40px;
            height: 22px;
            display: inline-block;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: color-mix(in oklab, CanvasText 12%, Canvas);
            border-radius: 999px;
            transition: background .2s ease;
        }
        .slider:before {
            content: "";
            position: absolute;
            height: 18px;
            width: 18px;
            left: 2px;
            top: 2px;
            background: CanvasText;
            border-radius: 50%;
            transition: transform .2s ease;
        }
        .switch input:checked + .slider {
            background: color-mix(in oklab, #60a5fa 50%, Canvas);
        }
        .switch input:checked + .slider:before {
            transform: translateX(18px);
        }
        .tools {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        <link rel="stylesheet" href="/header.css">
    </style>
    <script src="/header.js"></script>
</head>
<body>
    <div class="container">
        <div id="header-container" 
             data-title="Nowe zamówienie" 
             data-crumbs='/ <a href="/">Zamówienia</a> / Karta Wyrobu'>
        </div>

        <form id="order-form">
            <!-- Dodaj ze wzoru: wklej tekst z systemu klienta i uzupelnij pola automatycznie -->
            <div class="card" style="margin-bottom: 16px;">
                <div class="form-section">
                    <h2 class="section-title">Dodaj ze wzoru</h2>

                    <div class="form-group">
                        <label for="wzor-tekst">Wklej zamówienie ze wzoru</label>
                        <textarea id="wzor-tekst" rows="4" placeholder="Rodzaj Wyrobu: Worek PP Rozmiar: PP 230x380/30+40 Nadruk: Żelek Słonecznikowy Nakładanie: Druty Perforacja: Brak Pakowanie: Arkusz Ilość: 30tys Cena: 86,2"></textarea>
                    </div>

                    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                        <button type="button" class="btn btn-primary" id="btn-wzor-ok">OK</button>
                        <button type="button" class="btn" id="btn-wzor-clear">Wyczyść pole wzoru</button>
                        <span id="wzor-info" style="font-size: 13px; opacity: .75;"></span>
                    </div>
                </div>
            </div>

            <!-- Podstawowe Dane zamówienia -->
            <div class="card">
                <div class="form-section">
                    <h2 class="section-title">Podstawowe Dane zamówienia</h2>
                    
                    <div class="form-group">
                        <label for="zleceniobiorca">Zleceniobiorca <span class="required">*</span></label>
                        <div class="radio-group">
                            <div class="radio-option">
                                <input type="radio" id="zlec-bd" name="Zleceniobiorca" value="BD" required>
                                <label for="zlec-bd">BD</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="zlec-kk" name="Zleceniobiorca" value="KK" required>
                                <label for="zlec-kk">KK</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group" style="display: none;">
                        <label for="priorytet">Priorytet</label>
                        <div class="radio-group">
                            <div class="radio-option">
                                <input type="radio" id="prio-duza" name="Priorytet" value="Duża ilość na magazynie">
                                <label for="prio-duza">Duża ilość na magazynie</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="prio-1" name="Priorytet" value="1">
                                <label for="prio-1">1</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="prio-2" name="Priorytet" value="2">
                                <label for="prio-2">2</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="prio-3" name="Priorytet" value="3">
                                <label for="prio-3">3</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="prio-4" name="Priorytet" value="4">
                                <label for="prio-4">4</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="prio-5" name="Priorytet" value="5">
                                <label for="prio-5">5</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="prio-brak" name="Priorytet" value="BRAK NA MAGAZYNIE">
                                <label for="prio-brak">BRAK NA MAGAZYNIE</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="numer-zlecenia">Numer zlecenia <span class="required">*</span></label>
                        <input type="text" id="numer-zlecenia" name="Numer zlecenia" required readonly>
                    </div>

                    <div class="form-group">
                        <label for="zleceniodawca">Zleceniodawca</label>
                        <input type="text" id="zleceniodawca" name="Zleceniodawca">
                    </div>
                </div>
            </div>

            <!-- Dane wyrobu gotowego -->
            <div class="card">
                <div class="form-section">
                    <h2 class="section-title">Dane wyrobu gotowego</h2>
                    
                    <div class="form-group">
                        <label for="nazwa-wyrobu">Nazwa wyrobu gotowego</label>
                        <select id="nazwa-wyrobu" name="Nazwa wyrobu gotowego">
                            <option value="">-- Wybierz --</option>
                            <option value="Taśma PE">Taśma PE</option>
                            <option value="Półrękaw PE">Półrękaw PE</option>
                            <option value="Rękaw PE">Rękaw PE</option>
                            <option value="Worek PE">Worek PE</option>
                            <option value="Taśma PP">Taśma PP</option>
                            <option value="Worek PP">Worek PP</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="wymiar-wyrobu">Wymiar wyrobu gotowego</label>
                        <input type="text" id="wymiar-wyrobu" name="Wymiar wyrobu gotowego" placeholder="np. 400x600">
                    </div>

                    <div class="form-group">
                        <label for="ilosc-jednostka">Ilość (kg/szt/mb)</label>
                        <div class="checkbox-group">
                            <div class="checkbox-option">
                                <input type="checkbox" id="unit-kg" name="Ilość jednostka" value="Kilogramy">
                                <label for="unit-kg">Kilogramy</label>
                            </div>
                            <div class="checkbox-option">
                                <input type="checkbox" id="unit-szt" name="Ilość jednostka" value="Sztuk">
                                <label for="unit-szt">Sztuk</label>
                            </div>
                            <div class="checkbox-option">
                                <input type="checkbox" id="unit-mb" name="Ilość jednostka" value="Metry bieżące">
                                <label for="unit-mb">Metry bieżące</label>
                            </div>
                            <div class="checkbox-option">
                                <input type="checkbox" id="unit-other" name="Ilość jednostka" value="Other">
                                <label for="unit-other">Inne</label>
                            </div>
                        </div>
                        <input type="text" id="ilosc-wartosc" name="Ilość" placeholder="Podaj wartość" style="margin-top: 8px;">
                    </div>
                </div>
            </div>

            <!-- Wytłaczarka -->
            <div class="card">
                <div class="form-section">
                    <h2 class="section-title">Wytłaczarka - Parametry folii produkowanej na wytłaczarce</h2>
                    
                    <div class="form-group">
                        <label for="barwnik">Barwnik</label>
                        <input type="text" id="barwnik" name="Barwnik">
                    </div>

                    <div class="form-group">
                        <label for="jonizacja">Jonizacja</label>
                        <div class="radio-group">
                            <div class="radio-option">
                                <input type="radio" id="jon-tak" name="Jonizacja" value="TAK">
                                <label for="jon-tak">TAK</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="jon-nie" name="Jonizacja" value="NIE">
                                <label for="jon-nie">NIE</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="tworzywo">Tworzywo</label>
                        <input type="text" id="tworzywo" name="Tworzywo">
                    </div>

                    <div class="form-group">
                        <label for="szerokosc-rekawa">Całkowita szerokość rękawa</label>
                        <input type="text" id="szerokosc-rekawa" name="Całkowita szerokość rękawa">
                    </div>

                    <div class="form-group">
                        <label for="zakatka-boczna">Zakładka boczna</label>
                        <input type="text" id="zakatka-boczna" name="Zakładka boczna">
                    </div>

                    <div class="form-group">
                        <label for="grubosc">Grubość</label>
                        <input type="text" id="grubosc" name="Grubość">
                    </div>

                    <div class="form-group">
                        <label for="rodzaj-wyrobu">Rodzaj wyrobu</label>
                        <div class="radio-group">
                            <div class="radio-option">
                                <input type="radio" id="rodzaj-rekaw" name="Rodzaj wyrobu" value="Rękaw">
                                <label for="rodzaj-rekaw">Rękaw</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="rodzaj-polrekaw" name="Rodzaj wyrobu" value="Półrękaw">
                                <label for="rodzaj-polrekaw">Półrękaw</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="rodzaj-tasma" name="Rodzaj wyrobu" value="Taśma">
                                <label for="rodzaj-tasma">Taśma</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="nawoj-jednostka">Nawój na wałek (jaki/ile)</label>
                        <div class="checkbox-group">
                            <div class="checkbox-option">
                                <input type="checkbox" id="nawoj-kg" name="Nawój jednostka" value="KG">
                                <label for="nawoj-kg">KG</label>
                            </div>
                            <div class="checkbox-option">
                                <input type="checkbox" id="nawoj-mb" name="Nawój jednostka" value="MB">
                                <label for="nawoj-mb">MB</label>
                            </div>
                            <div class="checkbox-option">
                                <input type="checkbox" id="nawoj-other" name="Nawój jednostka" value="Other">
                                <label for="nawoj-other">Inne</label>
                            </div>
                        </div>
                        <input type="text" id="nawoj-wartosc" name="Nawój wartość" placeholder="Podaj wartość" style="margin-top: 8px;">
                    </div>

                    <div class="form-group">
                        <label for="uwagi-wytlaczarka">UWAGI</label>
                        <textarea id="uwagi-wytlaczarka" name="UWAGI Wytłaczarka"></textarea>
                    </div>
                </div>
            </div>

            <!-- Drukarnia -->
            <div class="card">
                <div class="form-section">
                    <h2 class="section-title">Drukarnia - Parametry na drukarni</h2>
                    
                    <div class="form-group">
                        <label for="drukarnia">DRUKARNIA</label>
                        <input type="text" id="drukarnia" name="DRUKARNIA">
                    </div>
                </div>
            </div>

            <!-- Automaty Tnące -->
            <div class="card">
                <div class="form-section">
                    <h2 class="section-title">Automaty Tnące - Parametry na automatach</h2>
                    
                    <div class="form-group">
                        <label for="szerokosc-automaty">Szerokość</label>
                        <input type="text" id="szerokosc-automaty" name="Szerokość Automaty">
                    </div>

                    <div class="form-group">
                        <label for="wysokosc-automaty">Wysokość</label>
                        <input type="text" id="wysokosc-automaty" name="Wysokość Automaty">
                    </div>

                    <div class="form-group">
                        <label for="zakatka-denna">Zakładka denna</label>
                        <input type="text" id="zakatka-denna" name="Zakładka denna">
                    </div>

                    <div class="form-group">
                        <label for="zrywka-klapka">Zrywka/Klapka</label>
                        <input type="text" id="zrywka-klapka" name="Zrywka/Klapka">
                    </div>

                    <div class="form-group">
                        <label for="zgrzew">Zgrzew</label>
                        <div class="checkbox-group">
                            <div class="checkbox-option">
                                <input type="checkbox" id="zgrzew-boczny" name="Zgrzew" value="Zgrzew boczny">
                                <label for="zgrzew-boczny">Zgrzew boczny</label>
                            </div>
                            <div class="checkbox-option">
                                <input type="checkbox" id="zgrzew-denny" name="Zgrzew" value="Zgrzew denny">
                                <label for="zgrzew-denny">Zgrzew denny</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Parametry dodatkowe</label>
                        <div class="checkbox-group">
                            <div class="checkbox-option">
                                <input type="checkbox" id="param-zimny-noz" name="Zimny nóż" value="Zimny nóż">
                                <label for="param-zimny-noz">Zimny nóż</label>
                            </div>
                            <div class="checkbox-option">
                                <input type="checkbox" id="param-tasma-klejaca" name="Taśma klejąca" value="Taśma klejąca">
                                <label for="param-tasma-klejaca">Taśma klejąca</label>
                            </div>
                        </div>
                    </div>

                    <!-- Zrywka: osobna sekcja - wybor JEDNEJ z trzech opcji.
                         Wybor zapisuje sie w kolumnie "Zrywka" w tabeli Zamowienia. -->
                    <div class="form-group" style="margin-top: 22px; padding-top: 18px; border-top: 1px solid rgba(127,127,127,.3);">
                        <label>Zrywka</label>
                        <div class="radio-group">
                            <div class="radio-option">
                                <input type="radio" id="zrywka-opaski" name="Zrywka" value="Opaski">
                                <label for="zrywka-opaski">Opaski</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="zrywka-klipsy" name="Zrywka" value="Klipsy">
                                <label for="zrywka-klipsy">Klipsy</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="zrywka-druty" name="Zrywka" value="Druty">
                                <label for="zrywka-druty">Druty</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="perforacja-typ">Perforacja</label>
                        <div class="radio-group">
                            <div class="radio-option">
                                <input type="radio" id="perf-makro" name="Perforacja typ" value="Makro">
                                <label for="perf-makro">Makro (ile otworów)</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="perf-mikro" name="Perforacja typ" value="Mikro">
                                <label for="perf-mikro">Mikro (ile otworów)</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="perf-other" name="Perforacja typ" value="Other">
                                <label for="perf-other">Inne</label>
                            </div>
                        </div>
                        <input type="text" id="perforacja-wartosc" name="Perforacja wartość" placeholder="Podaj wartość" style="margin-top: 8px;">
                    </div>

                    <div class="form-group">
                        <label for="pakowanie-typ">Pakowanie (szt.paczek/szt.zbiorowych)</label>
                        <div class="checkbox-group">
                            <div class="checkbox-option">
                                <input type="checkbox" id="pak-worek" name="Pakowanie" value="Worek">
                                <label for="pak-worek">Worek</label>
                            </div>
                            <div class="checkbox-option">
                                <input type="checkbox" id="pak-karton" name="Pakowanie" value="Karton">
                                <label for="pak-karton">Karton</label>
                            </div>
                            <div class="checkbox-option">
                                <input type="checkbox" id="pak-other" name="Pakowanie" value="Other">
                                <label for="pak-other">Inne</label>
                            </div>
                        </div>
                        <input type="text" id="pakowanie-other" name="Pakowanie inne" placeholder="Podaj wartość" style="margin-top: 8px; display: none;">
                    </div>
                </div>
            </div>

            <!-- Cena (pole wewnetrzne - NIE jest pokazywane na karcie wyrobu) -->
            <div class="card">
                <div class="form-section">
                    <h2 class="section-title">Cena</h2>

                    <div class="form-group">
                        <label for="cena">Cena</label>
                        <input type="text" id="cena" name="Cena" placeholder="np. 12,50 zł/kg">
                    </div>
                </div>
            </div>

        </form>
        
        <!-- Fixed buttons at bottom center -->
        <div class="form-actions-fixed">
            <button type="button" class="btn" id="btn-clear">Wyczyść formularz</button>
            <button type="submit" form="order-form" class="btn btn-primary" id="btn-submit">Zapisz zamówienie</button>
        </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + (isError ? 'error' : 'success');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Theme toggle
        document.addEventListener('DOMContentLoaded', () => {
            const toggle = document.getElementById('light-toggle');
            const label = document.getElementById('theme-label');

            function applyTheme(theme) {
                const isLight = theme === 'light';
                document.documentElement.setAttribute('data-theme', isLight ? 'light' : 'dark');
                if (toggle) toggle.checked = isLight;
                if (label) label.textContent = isLight ? 'Jasny motyw' : 'Ciemny motyw';
                try { localStorage.setItem('theme', isLight ? 'light' : 'dark'); } catch (e) {}
            }

            let savedTheme = 'dark';
            try { if (localStorage.getItem('theme') === 'light') savedTheme = 'light'; } catch (e) {}
            applyTheme(savedTheme);

            if (toggle) {
                toggle.addEventListener('change', () => applyTheme(toggle.checked ? 'light' : 'dark'));

            // Show/hide "Pakowanie inne" text field
            const pakOtherCheckbox = document.getElementById('pak-other');
            const pakOtherInput = document.getElementById('pakowanie-other');
            if (pakOtherCheckbox && pakOtherInput) {
                const togglePakOtherField = () => {
                    pakOtherInput.style.display = pakOtherCheckbox.checked ? 'block' : 'none';
                    if (!pakOtherCheckbox.checked) {
                        pakOtherInput.value = '';
                    }
                };
                pakOtherCheckbox.addEventListener('change', togglePakOtherField);
                // Check initial state
                togglePakOtherField();
            }

            // Auto-generate order number based on Zleceniobiorca
            async function generateOrderNumber(zleceniobiorca) {
                if (!zleceniobiorca) return '';
                
                try {
                    // Get all orders to count how many exist for this Zleceniobiorca
                    const res = await fetch('/api/zamowienia?page=1&pageSize=1000');
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    const items = Array.isArray(data.items) ? data.items : [];
                    
                    // Count orders for this Zleceniobiorca
                    const count = items.filter(item => item['Zleceniobiorca'] === zleceniobiorca).length;
                    
                    // Get current date
                    const now = new Date();
                    const day = String(now.getDate()).padStart(2, '0');
                    const month = String(now.getMonth() + 1).padStart(2, '0');
                    
                    // Generate order number: Zleceniobiorca/(count+1)/DD/MM
                    const orderNumber = `${zleceniobiorca}/${count + 1}/${day}/${month}`;
                    
                    return orderNumber;
                } catch (error) {
                    console.error('Error generating order number:', error);
                    // Fallback: just use date if count fails
                    const now = new Date();
                    const day = String(now.getDate()).padStart(2, '0');
                    const month = String(now.getMonth() + 1).padStart(2, '0');
                    return `${zleceniobiorca}/1/${day}/${month}`;
                }
            }

            // Auto-generate order number when Zleceniobiorca is selected
            const zleceniobiorcaRadios = document.querySelectorAll('input[name="Zleceniobiorca"]');
            const numerZleceniaInput = document.getElementById('numer-zlecenia');
            
            zleceniobiorcaRadios.forEach(radio => {
                radio.addEventListener('change', async () => {
                    if (radio.checked && numerZleceniaInput) {
                        const zleceniobiorca = radio.value;
                        const orderNumber = await generateOrderNumber(zleceniobiorca);
                        if (orderNumber) {
                            numerZleceniaInput.value = orderNumber;
                        }
                    }
                });
            });

            // Form submission
            const form = document.getElementById('order-form');
            const submitBtn = document.getElementById('btn-submit');
            const clearBtn = document.getElementById('btn-clear');
            
            // Make sure buttons are always visible
            if (submitBtn) {
                submitBtn.setAttribute('form', 'order-form');
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                // Collect form data
                const formData = new FormData(form);
                const data = {};

                // Collect radio buttons
                const radioGroups = {};
                form.querySelectorAll('input[type="radio"]:checked').forEach(radio => {
                    if (radio.name) {
                        radioGroups[radio.name] = radio.value;
                    }
                });

                // Collect checkboxes
                const checkboxes = {};
                form.querySelectorAll('input[type="checkbox"]:checked').forEach(checkbox => {
                    if (checkbox.name) {
                        if (!checkboxes[checkbox.name]) {
                            checkboxes[checkbox.name] = [];
                        }
                        checkboxes[checkbox.name].push(checkbox.value);
                    }
                });

                // Pola pomocnicze: sa czescia innych pol, nie moga zapisac sie osobno
                const HELPER_FIELD_NAMES = [
                    'Ilość jednostka', 'Nawój jednostka', 'Pakowanie inne', 'Perforacja wartość',
                    'Zimny nóż', 'Taśma klejąca'
                ];

                // Combine all data (but skip fields that will be handled specially)
                for (const [key, value] of formData.entries()) {
                    // "Ilość" i "Nawój wartość" sa skladane z pol wyboru nizej,
                    // a pola z HELPER_FIELD_NAMES tylko zasmiecaja dane.
                    if (key === 'Ilość' || key === 'Nawój wartość' || HELPER_FIELD_NAMES.includes(key)) {
                        continue;
                    }
                    if (value.trim()) {
                        data[key] = value.trim();
                    }
                }

                // Add radio values
                Object.assign(data, radioGroups);

                // Handle "Ilość jednostka" + "Ilość" - combine checkbox values with text field
                const iloscJednostka = checkboxes['Ilość jednostka'] || [];
                const iloscWartosc = formData.get('Ilość')?.trim() || '';
                if (iloscJednostka.length > 0 || iloscWartosc) {
                    const parts = [];
                    // Add checkbox values (excluding "Other" if it's selected, we'll handle it separately)
                    const iloscJednostkaFiltered = iloscJednostka.filter(v => v !== 'Other');
                    if (iloscJednostkaFiltered.length > 0) {
                        parts.push(...iloscJednostkaFiltered);
                    }
                    // Add text field value if provided
                    if (iloscWartosc) {
                        parts.push(iloscWartosc);
                    }
                    // If "Other" is checked but no text, add "Other"
                    if (iloscJednostka.includes('Other') && !iloscWartosc) {
                        parts.push('Other');
                    }
                    if (parts.length > 0) {
                        data['Ilość'] = parts.join(', ');
                    }
                }
                // Remove "Ilość jednostka" from checkboxes to avoid duplication
                delete checkboxes['Ilość jednostka'];

                // Handle "Nawój jednostka" + "Nawój wartość" - combine checkbox values with text field
                const nawojJednostka = checkboxes['Nawój jednostka'] || [];
                const nawojWartosc = formData.get('Nawój wartość')?.trim() || '';
                if (nawojJednostka.length > 0 || nawojWartosc) {
                    const parts = [];
                    // Add checkbox values (excluding "Other" if it's selected)
                    const nawojJednostkaFiltered = nawojJednostka.filter(v => v !== 'Other');
                    if (nawojJednostkaFiltered.length > 0) {
                        parts.push(...nawojJednostkaFiltered);
                    }
                    // Add text field value if provided
                    if (nawojWartosc) {
                        parts.push(nawojWartosc);
                    }
                    // If "Other" is checked but no text, add "Other"
                    if (nawojJednostka.includes('Other') && !nawojWartosc) {
                        parts.push('Other');
                    }
                    if (parts.length > 0) {
                        data['Nawój wartość'] = parts.join(', ');
                    }
                }
                // Remove "Nawój jednostka" from checkboxes to avoid duplication
                delete checkboxes['Nawój jednostka'];

                // Handle "Pakowanie" - combine checkbox values with text field
                const pakowanie = checkboxes['Pakowanie'] || [];
                const pakowanieOther = formData.get('Pakowanie inne')?.trim() || '';
                if (pakowanie.length > 0 || pakowanieOther) {
                    const parts = [];
                    // Add checkbox values (excluding "Other" if it's selected)
                    const pakowanieFiltered = pakowanie.filter(v => v !== 'Other');
                    if (pakowanieFiltered.length > 0) {
                        parts.push(...pakowanieFiltered);
                    }
                    // Add text field value if provided
                    if (pakowanieOther) {
                        parts.push(pakowanieOther);
                    }
                    // If "Other" is checked but no text, add "Other"
                    if (pakowanie.includes('Other') && !pakowanieOther) {
                        parts.push('Other');
                    }
                    if (parts.length > 0) {
                        data['Pakowanie'] = parts.join(', ');
                    }
                }
                // Remove "Pakowanie" from checkboxes to avoid duplication
                delete checkboxes['Pakowanie'];

                // Perforacja: typ (Makro/Mikro/Inne) + wartosc -> istniejaca kolumna "Perforacja"
                const perforacjaTyp = radioGroups['Perforacja typ'] || '';
                const perforacjaWartosc = formData.get('Perforacja wartość')?.trim() || '';
                if (perforacjaTyp || perforacjaWartosc) {
                    const parts = [];
                    if (perforacjaTyp && perforacjaTyp !== 'Other') parts.push(perforacjaTyp);
                    if (perforacjaWartosc) parts.push(perforacjaWartosc);
                    if (perforacjaTyp === 'Other' && !perforacjaWartosc) parts.push('Other');
                    if (parts.length > 0) {
                        data['Perforacja'] = parts.join(', ');
                    }
                }
                delete data['Perforacja typ'];

                // Handle "Parametry dodatkowe" - combine all related checkboxes into one field
                const parametryDodatkoweFields = ['Zimny nóż', 'Taśma klejąca'];
                const parametryDodatkowe = [];
                parametryDodatkoweFields.forEach(fieldName => {
                    if (checkboxes[fieldName] && checkboxes[fieldName].length > 0) {
                        parametryDodatkowe.push(...checkboxes[fieldName]);
                        delete checkboxes[fieldName]; // Remove from checkboxes to avoid duplication
                    }
                });
                if (parametryDodatkowe.length > 0) {
                    data['Parametry dodatkowe'] = parametryDodatkowe.join(', ');
                }

                // Add remaining checkbox values (as arrays or comma-separated)
                Object.keys(checkboxes).forEach(key => {
                    if (checkboxes[key].length === 1) {
                        data[key] = checkboxes[key][0];
                    } else if (checkboxes[key].length > 1) {
                        data[key] = checkboxes[key].join(', ');
                    }
                });

                // --- Przypisz wartosci do ISTNIEJACYCH kolumn -------------------------
                // Formularz nazywa pola po swojemu, a w bazie sa juz wlasciwe kolumny.
                // Bez tego powstawaly dodatkowe kolumny (np. "Ilość", "Szerokość Automaty").
                const RENAME_TO_EXISTING_COLUMN = {
                    'Ilość': 'Ilość kg/szt/mb',
                    'Nawój wartość': 'Nawój na wałek (jaki/ile)',
                    'Pakowanie': 'Pakowanie (szt.paczek/szt.zbiorowych)',
                    'Szerokość Automaty': 'Szerokość',
                    'Wysokość Automaty': 'Wysokość',
                    'UWAGI Wytłaczarka': 'UWAGI',
                    'Perforacja typ': 'Perforacja'
                };
                Object.entries(RENAME_TO_EXISTING_COLUMN).forEach(([formKey, columnKey]) => {
                    if (data[formKey] === undefined) return;
                    const value = String(data[formKey]).trim();
                    const existing = data[columnKey] === undefined ? '' : String(data[columnKey]).trim();
                    if (value && !existing) {
                        data[columnKey] = data[formKey];
                    }
                    delete data[formKey];
                });

                // Validate required fields
                if (!data['Zleceniobiorca']) {
                    showToast('Zleceniobiorca jest wymagany', true);
                    return;
                }
                if (!data['Numer zlecenia']) {
                    showToast('Numer zlecenia jest wymagany', true);
                    return;
                }

                // Disable submit button
                submitBtn.disabled = true;
                submitBtn.textContent = 'Zapisywanie...';

                try {
                    const response = await fetch('/api/zamowienia', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(result.error || 'Błąd zapisu');
                    }

                    if (result.ok) {
                        showToast('Zamówienie zostało zapisane pomyślnie!');
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 1500);
                    } else {
                        throw new Error(result.error || 'Błąd zapisu');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    showToast('Błąd podczas zapisywania zamówienia: ' + error.message, true);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Zapisz zamówienie';
                }
            });

            // Clear form
            if (clearBtn) {
                clearBtn.addEventListener('click', () => {
                    if (confirm('Czy na pewno chcesz wyczyścić formularz?')) {
                        form.reset();
                        showToast('Formularz został wyczyszczony');
                    }
                });
            }

            // ------------------------------------------------------------------
            // "Dodaj ze wzoru" - wklej tekst z systemu klienta, reszta uzupelni sie sama
            // ------------------------------------------------------------------
            const WZOR_LABELS = ['Rodzaj Wyrobu', 'Rozmiar', 'Materiał', 'Nadruk', 'Nakładanie', 'Perforacja', 'Pakowanie', 'Ilość', 'Cena', 'Zleceniodawca'];

            // Zalogowany uzytkownik -> zleceniobiorca
            const USER_TO_ZLECENIOBIORCA = {
                'admin': 'KK',
                'KamilK': 'KK',
                'BeataD': 'BD'
            };

            // "Nakładanie" ze wzoru -> wartosc kolumny "Zrywka"
            const NAKLADANIE_TO_ZRYWKA = {
                'druty': 'Druty',
                'klipsy': 'Klipsy',
                'trytyki': 'Opaski'   // w systemie klienta "Trytyki" to nasze "Opaski"
            };

            // Rozbija wklejony tekst na pola wg etykiet (dziala tez gdy wszystko jest w jednej linii)
            function parseWzor(text) {
                const out = {};
                if (!text) return out;
                const norm = String(text).replace(/[\r\n]+/g, ' ').replace(/\s+/g, ' ');
                const pattern = WZOR_LABELS
                    .map(l => l.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
                    .join('|');
                const re = new RegExp('(' + pattern + ')\\s*:\\s*', 'gi');
                const hits = [];
                let m;
                while ((m = re.exec(norm)) !== null) {
                    hits.push({ label: m[1], at: m.index, from: re.lastIndex });
                }
                hits.forEach((hit, i) => {
                    const stop = i + 1 < hits.length ? hits[i + 1].at : norm.length;
                    const value = norm.slice(hit.from, stop).trim().replace(/\s*,\s*$/, '');
                    const known = WZOR_LABELS.find(l => l.toLowerCase() === hit.label.toLowerCase());
                    out[known || hit.label] = value;
                });
                return out;
            }

            // Wpisuje wartosc do listy wyboru; jesli nie ma takiej opcji - dopisuje ja
            function setSelectValue(select, value) {
                if (!select || !value) return false;
                const v = String(value).trim().toLowerCase();
                const opt = Array.from(select.options).find(o => o.value.trim().toLowerCase() === v);
                if (opt) { select.value = opt.value; return true; }
                const created = document.createElement('option');
                created.value = String(value).trim();
                created.textContent = String(value).trim();
                select.appendChild(created);
                select.value = created.value;
                return true;
            }

            // Zdejmuje zaznaczenie z podanych pol (zeby stare wybory nie zostaly obok nowych)
            function clearCheckboxes(ids) {
                ids.forEach(id => {
                    const el = document.getElementById(id);
                    if (el && el.checked) {
                        el.checked = false;
                        el.dispatchEvent(new Event('change', { bubbles: true }));
                    }
                });
            }

            // Wyciaga ilosc sztuk z tekstu: "30tys" -> 30000, "2 x po 28 tyś" -> 56000, "5000" -> 5000
            function parseIloscSztuk(text) {
                const t = String(text || '').toLowerCase().replace(/,/g, '.').replace(/\s+/g, ' ').trim();
                if (!t) return null;
                const tys = /tys|tyś|tysi/.test(t);
                const multi = t.match(/(\d+(?:\.\d+)?)\s*x\s*po\s*(\d+(?:\.\d+)?)/);
                if (multi) {
                    const v = Number(multi[1]) * Number(multi[2]);
                    return Math.round(tys ? v * 1000 : v);
                }
                const num = t.match(/(\d+(?:\.\d+)?)/);
                if (!num) return null;
                return Math.round(tys ? Number(num[1]) * 1000 : Number(num[1]));
            }

            // Waga w kg z tekstu: "4x25kg" -> {total:100, jednostkowa:25}, "500kg" -> {total:500}, "100" -> {total:100}
            function parseWaga(text) {
                const t = String(text || '').toLowerCase().replace(/\s+/g, '');
                if (!t) return null;
                const multi = t.match(/(\d+(?:[.,]\d+)?)x(\d+(?:[.,]\d+)?)\s*kg/);
                if (multi) {
                    const szt = Number(multi[1].replace(',', '.'));
                    const jedn = Number(multi[2].replace(',', '.'));
                    return { total: szt * jedn, jednostkowa: jedn };
                }
                const single = t.match(/(\d+(?:[.,]\d+)?)\s*kg/);
                if (single) return { total: Number(single[1].replace(',', '.')), jednostkowa: null };
                const plain = t.match(/^(\d+(?:[.,]\d+)?)$/);
                if (plain) return { total: Number(plain[1].replace(',', '.')), jednostkowa: null };
                return null;
            }

            // Liczba bez zbednych zer: 100 -> "100", 39.9 -> "39,9"
            function formatKg(n) {
                return String(Math.round(Number(n) * 100) / 100).replace('.', ',');
            }

            async function applyWzor() {
                const textarea = document.getElementById('wzor-tekst');
                const info = document.getElementById('wzor-info');
                const d = parseWzor(textarea ? textarea.value : '');
                const filled = [];
                let wymiary = null; // wymiary z "Rozmiar" - potrzebne do wyliczenia "Tworzywo"
                let typWyrobu = null; // 'worek' (240x370/30+40) albo 'arkusz' (1400x2000x0,035)

                // Material: "PP"/"PE" w rodzaju wyrobu, rozmiarze albo w polu "Materiał"
                const opisWyrobu = (d['Rodzaj Wyrobu'] || '') + ' ' + (d['Rozmiar'] || '') + ' ' + (d['Materiał'] || '');
                const czyPP = /(^|[^a-z])pp([^a-z]|$)/i.test(opisWyrobu);
                const czyPE = !czyPP && /(^|[^a-z])pe([^a-z]|$)/i.test(opisWyrobu);
                // Gestosci: PP i PE z oryginalu = 920, PE wtorny = 950 (ustalenia z uzytkownikiem)
                const GESTOSC_920 = 920, GESTOSC_WTORNY = 950;
                const materialZeWzoru = String(d['Materiał'] || '').trim();
                const gestosc = /wt[óo]rn/i.test(materialZeWzoru) ? GESTOSC_WTORNY : GESTOSC_920;
                // Nazwa materialu dla workow chlebowych: PP zostaje "PP",
                // PE bierze nazwe z pola "Materiał" (oryginał/wtórny), a bez niego "Oryginał"
                const materialTworzywa = czyPP ? 'PP' : (czyPE ? (materialZeWzoru || 'Oryginał') : null);

                if (Object.keys(d).length === 0) {
                    showToast('Nie rozpoznano wzoru - wklej tekst z etykietami (Rodzaj Wyrobu:, Rozmiar:, Nadruk:, ...)', true);
                    return;
                }

                // 1) Zleceniobiorca + numer zlecenia - wg zalogowanego uzytkownika i kolejnosci zlecen
                try {
                    const me = await (await fetch('/api/user/me')).json();
                    const kto = me && me.username ? USER_TO_ZLECENIOBIORCA[me.username] : null;
                    if (kto) {
                        const radio = document.getElementById(kto === 'KK' ? 'zlec-kk' : 'zlec-bd');
                        if (radio) {
                            radio.checked = true;
                            radio.dispatchEvent(new Event('change', { bubbles: true }));
                            filled.push('Zleceniobiorca ' + kto + ' + numer zlecenia');
                        }
                    } else {
                        showToast('Nie wiem, kogo przypisac (' + (me && me.username) + ') - wybierz zleceniobiorce recznie', true);
                    }
                } catch (e) {
                    console.warn('Nie udalo sie ustalic uzytkownika:', e);
                }

                // 2) Rodzaj Wyrobu -> Nazwa wyrobu gotowego
                //    Jesli "PP" jest w rodzaju wyrobu albo w rozmiarze - na 99% jest to "Worek PP".
                const nazwaSelect = document.getElementById('nazwa-wyrobu');
                const rodzajZeWzoru = String(d['Rodzaj Wyrobu'] || '').trim();
                const rodzajJestNaLiscie = !!rodzajZeWzoru && !!nazwaSelect &&
                    Array.from(nazwaSelect.options).some(o => o.value.trim().toLowerCase() === rodzajZeWzoru.toLowerCase());
                if (rodzajJestNaLiscie) {
                    setSelectValue(nazwaSelect, rodzajZeWzoru);
                    filled.push('Nazwa wyrobu gotowego');
                } else if (czyPP) {
                    setSelectValue(nazwaSelect, 'Worek PP');
                    filled.push('Nazwa wyrobu gotowego: Worek PP (PP we wzorze)');
                } else if (rodzajZeWzoru) {
                    setSelectValue(nazwaSelect, rodzajZeWzoru);
                    filled.push('Nazwa wyrobu gotowego');
                }

                // 3) Rozmiar -> Wymiar wyrobu gotowego + wymiary szczegolowe
                //    Worki (PP/PE):          240x370/30+40    -> szerokosc/wysokosc/zakladka/zrywka
                //    Arkusz/Rekaw/Polrekaw:  1400x2000x0,035 -> tylko pierwsza wartosc + grubosc
                if (d['Rozmiar'] !== undefined && d['Rozmiar'] !== '') {
                    const rozmiar = String(d['Rozmiar']).trim();
                    const dim = document.getElementById('wymiar-wyrobu');
                    if (dim) { dim.value = rozmiar; filled.push('Wymiar wyrobu gotowego'); }

                    const arkuszMatch = rozmiar.match(/(\d+)\s*[xX×]\s*(\d+)\s*[xX×]\s*(\d+(?:[.,]\d+)?)/);
                    const worekMatch = rozmiar.match(/(\d+)\s*[xX×]\s*(\d+)\s*(?:\/\s*(\d+))?\s*(?:\+\s*(\d+))?/);
                    // Rekaw: "szerokosc x grubosc", Polrekaw: "1/2 szerokosc x grubosc" (tylko 2 wartosci)
                    const rekawMatch = rozmiar.match(/^(?:1\s*\/\s*2\s*)?\D*(\d+(?:[.,]\d+)?)\s*[xX×]\s*(\d+(?:[.,]\d+)?)\s*$/);

                    if (arkuszMatch) {
                        // Worek prosty: szerokosc x dlugosc x grubosc
                        // (Arkusz to ten sam zapis, ale pojedyncza warstwa - wtedy 1 zamiast 2)
                        const czyArkusz = /arkusz/i.test(rozmiar);
                        typWyrobu = czyArkusz ? 'arkusz' : 'worek3';
                        wymiary = {
                            szerokosc: Number(arkuszMatch[1]),
                            wysokosc: Number(arkuszMatch[2]),
                            grubosc: Number(arkuszMatch[3].replace(',', '.')),
                            warstwy: czyArkusz ? 1 : 2
                        };
                        // Całkowita szerokość rękawa = pierwsza wartość z rozmiaru
                        const srA = document.getElementById('szerokosc-rekawa');
                        if (srA) { srA.value = arkuszMatch[1]; filled.push('Całkowita szerokość rękawa'); }
                        // Grubość (sekcja wytłaczarki)
                        const grA = document.getElementById('grubosc');
                        if (grA) { grA.value = arkuszMatch[3].replace('.', ','); filled.push('Grubość'); }
                        if (czyArkusz) {
                            // arkusza nie opisują pola automaty
                            const sw = document.getElementById('szerokosc-automaty'); if (sw) sw.value = '';
                            const wy = document.getElementById('wysokosc-automaty'); if (wy) wy.value = '';
                        } else {
                            // worek prosty: Szerokość i Wysokość w sekcji automaty
                            const sw = document.getElementById('szerokosc-automaty'); if (sw) { sw.value = arkuszMatch[1]; filled.push('Szerokość'); }
                            const wy = document.getElementById('wysokosc-automaty'); if (wy) { wy.value = arkuszMatch[2]; filled.push('Wysokość'); }
                        }
                    } else if (rekawMatch) {
                        // Rekaw / Polrekaw: szerokosc x grubosc - waga jest w polu "Ilość"
                        typWyrobu = 'rekaw';
                        wymiary = {
                            szerokosc: Number(rekawMatch[1]),
                            grubosc: Number(rekawMatch[2].replace(',', '.'))
                        };
                        const sr = document.getElementById('szerokosc-rekawa');
                        if (sr) { sr.value = rekawMatch[1]; filled.push('Całkowita szerokość rękawa'); }
                        const gr = document.getElementById('grubosc');
                        if (gr) { gr.value = rekawMatch[2].replace('.', ','); filled.push('Grubość'); }
                    } else if (worekMatch) {
                        typWyrobu = 'worek';
                        wymiary = {
                            szerokosc: Number(worekMatch[1]),
                            wysokosc: Number(worekMatch[2]),
                            zakladka: worekMatch[3] ? Number(worekMatch[3]) : 0,
                            zrywka: worekMatch[4] ? Number(worekMatch[4]) : 0
                        };
                        // Przy PE szerokosc idzie do "Całkowita szerokość rękawa", przy PP do "Szerokość"
                        if (czyPE) {
                            const sr = document.getElementById('szerokosc-rekawa');
                            if (sr) { sr.value = worekMatch[1]; filled.push('Całkowita szerokość rękawa'); }
                            // przy PE pole "Szerokość" nie jest uzywane - czyscimy, zeby nie zostala stara wartosc
                            const sw = document.getElementById('szerokosc-automaty');
                            if (sw) sw.value = '';
                        } else {
                            const sw = document.getElementById('szerokosc-automaty');
                            if (sw) { sw.value = worekMatch[1]; filled.push('Szerokość'); }
                            // przy PP "Całkowita szerokość rękawa" nie jest z tego wzoru
                            const sr = document.getElementById('szerokosc-rekawa');
                            if (sr) sr.value = '';
                        }
                        const pairs = [
                            ['wysokosc-automaty', worekMatch[2], 'Wysokość'],
                            ['zakatka-denna', worekMatch[3], 'Zakładka denna'],
                            ['zrywka-klapka', worekMatch[4], 'Zrywka/Klapka']
                        ];
                        pairs.forEach(([id, val, label]) => {
                            if (val === undefined) return;
                            const el = document.getElementById(id);
                            if (el) { el.value = val; filled.push(label); }
                        });
                        // Worki chlebowe PE: grubosc 25um
                        if (czyPE) {
                            const gr = document.getElementById('grubosc');
                            if (gr) { gr.value = '0,025'; filled.push('Grubość: 0,025'); }
                        }
                    } else {
                        showToast('Nie rozpoznalem rozmiaru (240x370/30+40, 700x1000x0,03, 600x0,035)', true);
                    }
                }

                // 3b) Zgrzew: worek chlebowy (z zakładką i zrywką) => boczny,
                //     worek prosty (szerokość x długość x grubość) => denny,
                //     pozostałe przypadki (arkusz, rękaw, półrękaw) => nic nie zaznaczamy
                const zgrzewBocznyEl = document.getElementById('zgrzew-boczny');
                const zgrzewDennyEl = document.getElementById('zgrzew-denny');
                if (zgrzewBocznyEl) zgrzewBocznyEl.checked = false;
                if (zgrzewDennyEl) zgrzewDennyEl.checked = false;
                if (typWyrobu === 'worek' && zgrzewBocznyEl) {
                    zgrzewBocznyEl.checked = true;
                    filled.push('Zgrzew: boczny');
                } else if (typWyrobu === 'worek3' && zgrzewDennyEl) {
                    zgrzewDennyEl.checked = true;
                    filled.push('Zgrzew: denny');
                }

                // 4) Nadruk -> DRUKARNIA
                if (d['Nadruk'] !== undefined) {
                    const el = document.getElementById('drukarnia');
                    if (el) { el.value = d['Nadruk']; filled.push('DRUKARNIA'); }
                }

                // 5) Nakładanie -> Zrywka (Druty/Klipsy/Trytyki->Opaski; "Układany" pomijamy)
                if (d['Nakładanie'] !== undefined) {
                    const zrywka = NAKLADANIE_TO_ZRYWKA[String(d['Nakładanie']).trim().toLowerCase()];
                    const radioIds = { 'Druty': 'zrywka-druty', 'Klipsy': 'zrywka-klipsy', 'Opaski': 'zrywka-opaski' };
                    if (zrywka) {
                        const r = document.getElementById(radioIds[zrywka]);
                        if (r) { r.checked = true; filled.push('Zrywka: ' + zrywka); }
                    }
                }

                // 6) Perforacja -> Makro/Mikro + ilosc otworow
                if (d['Perforacja'] !== undefined) {
                    const text = String(d['Perforacja']).trim();
                    const low = text.toLowerCase();
                    const ilosc = (text.match(/\d+/) || [])[0] || '';
                    const wartoscEl = document.getElementById('perforacja-wartosc');
                    if (low.includes('mikro') || low.includes('makro')) {
                        const r = document.getElementById(low.includes('mikro') ? 'perf-mikro' : 'perf-makro');
                        if (r) r.checked = true;
                        if (wartoscEl) wartoscEl.value = ilosc; // brak ilosci => czysci pole
                        filled.push('Perforacja: ' + text);
                    } else if (low && low !== 'brak' && low !== 'nie') {
                        const r = document.getElementById('perf-other');
                        if (r) r.checked = true;
                        if (wartoscEl) wartoscEl.value = text;
                        filled.push('Perforacja: ' + text);
                    }
                }

                // 7) Pakowanie -> Worek/Karton, inaczej "Inne" + wartosc
                if (d['Pakowanie'] !== undefined) {
                    const text = String(d['Pakowanie']).trim();
                    const low = text.toLowerCase();
                    if (text) {
                        // najpierw zdejmujemy stara grupe, zeby stare zaznaczenie nie zostalo
                        clearCheckboxes(['pak-worek', 'pak-karton', 'pak-other']);
                        if (low.includes('worek')) {
                            const r = document.getElementById('pak-worek');
                            if (r) r.checked = true;
                        } else if (low.includes('karton')) {
                            const r = document.getElementById('pak-karton');
                            if (r) r.checked = true;
                        } else {
                            const r = document.getElementById('pak-other');
                            if (r) {
                                r.checked = true;
                                r.dispatchEvent(new Event('change', { bubbles: true }));
                                const t = document.getElementById('pakowanie-other');
                                if (t) t.value = text;
                            }
                        }
                        filled.push('Pakowanie: ' + text);
                    }
                }

                // 8) Ilość -> jednostka + wartosc do pola tekstowego
                if (d['Ilość'] !== undefined) {
                    const text = String(d['Ilość']).trim();
                    const low = text.toLowerCase();
                    clearCheckboxes(['unit-kg', 'unit-szt', 'unit-mb', 'unit-other']);
                    let unitId = null;
                    if (/(^|[^a-z])kg|kilogram/.test(low)) unitId = 'unit-kg';
                    else if (/\bszt\b|sztuk/.test(low)) unitId = 'unit-szt';
                    else if (/\bmb\b|metr/.test(low)) unitId = 'unit-mb';
                    if (unitId) {
                        const r = document.getElementById(unitId);
                        if (r) r.checked = true;
                    }
                    const v = document.getElementById('ilosc-wartosc');
                    if (v) v.value = text;
                    filled.push('Ilość kg/szt/mb');
                }

                // 8b) Tworzywo + waga
                //   Worek chlebowy (240x370/30+40): "PP 840; 140kg" / "Oryginał 840; 140kg"
                //     masa = szerokosc * tasma / 1e6 * 0,000025 * gestosc * ilosc
                //   Worek prosty / Arkusz (700x1000x0,03): "wtórny; 40kg"
                //     masa = szerokosc * dlugosc * grubosc * warstwy * gestosc * ilosc
                //   Rekaw / Polrekaw (600x0,035): waga jest juz podana w "Ilość" (np. 4x25kg = 100kg)
                //   Wagi zaokraglamy W GORE do pelnych kg (Math.ceil)
                if (typWyrobu && wymiary) {
                    const iloscTekst = String(d['Ilość'] || '').toLowerCase();

                    if (typWyrobu === 'rekaw') {
                        const waga = parseWaga(d['Ilość']);
                        if (waga && waga.total) {
                            const material = materialZeWzoru || materialTworzywa || 'Oryginał';
                            const wartosc = material + '; ' + formatKg(waga.total) + 'kg';
                            const el = document.getElementById('tworzywo');
                            if (el) { el.value = wartosc; filled.push('Tworzywo: ' + wartosc); }
                            // zapis "4x25kg" => Nawój na wałek: KG + 25
                            if (waga.jednostkowa) {
                                const chk = document.getElementById('nawoj-kg');
                                if (chk) { chk.checked = true; chk.dispatchEvent(new Event('change', { bubbles: true })); }
                                const nv = document.getElementById('nawoj-wartosc');
                                if (nv) { nv.value = String(waga.jednostkowa); filled.push('Nawój na wałek: KG ' + waga.jednostkowa); }
                            }
                        } else {
                            showToast('Tworzywo: w "Ilość" nie widze wagi (np. 100kg albo 4x25kg)', true);
                        }
                    } else {
                        const toSztuki = /szt|ty[śs]|tys/.test(iloscTekst);
                        const toMasaLubDlugosc = /(^|[^a-z])kg|kilogram|\bmb\b|metr/.test(iloscTekst);
                        const iloscSztuk = (toSztuki || !toMasaLubDlugosc) ? parseIloscSztuk(iloscTekst) : null;

                        if (!iloscSztuk) {
                            showToast('Tworzywo: nie znam ilosci sztuk (wzor podaje "' + (d['Ilość'] || '') + '")', true);
                        } else if (typWyrobu === 'worek3' || typWyrobu === 'arkusz') {
                            const masa = (wymiary.szerokosc / 1000) * (wymiary.wysokosc / 1000) *
                                (wymiary.grubosc / 1000) * wymiary.warstwy * gestosc * iloscSztuk;
                            const wartosc = (materialZeWzoru || materialTworzywa || 'Oryginał') + '; ' + Math.ceil(masa) + 'kg';
                            const el = document.getElementById('tworzywo');
                            if (el) { el.value = wartosc; filled.push('Tworzywo: ' + wartosc); }
                        } else if (materialTworzywa) {
                            // worki chlebowe: grubosc 25um = 0,000025 m
                            const tasma = (wymiary.wysokosc + wymiary.zakladka) * 2 + wymiary.zrywka;
                            const masa = (wymiary.szerokosc * tasma / 1000000) * 0.000025 * gestosc * iloscSztuk;
                            const wartosc = materialTworzywa + ' ' + Math.round(tasma) + '; ' + Math.ceil(masa) + 'kg';
                            const el = document.getElementById('tworzywo');
                            if (el) { el.value = wartosc; filled.push('Tworzywo: ' + wartosc); }
                        } else {
                            showToast('Tworzywo: nie wiem czy to PP czy PE (brak "PP"/"PE" we wzorze)', true);
                        }
                    }
                } else if (czyPP || czyPE) {
                    showToast('Tworzywo: brak rozmiaru w znanym formacie', true);
                }

                // 9) Cena (bez znacznika waluty ",-", ale jednostka np. "/szt" zostaje)
                if (d['Cena'] !== undefined && d['Cena'] !== '') {
                    const cena = String(d['Cena']).trim()
                        .replace(/\s*,?\s*-+(?=\/|\s*$)/g, '')
                        .replace(/\s*z[lł]\b/gi, '')
                        .replace(/\s+\//g, '/')
                        .replace(/\s+/g, ' ')
                        .trim();
                    const el = document.getElementById('cena');
                    if (el) { el.value = cena; filled.push('Cena'); }
                }

                if (info) {
                    info.textContent = filled.length ? 'Uzupelnione: ' + filled.join(', ') : 'Nic nie uzupelniono';
                }
                showToast(filled.length ? ('Uzupelniono z wzoru: ' + filled.length + ' pol') : 'Nic nie uzupelniono');
            }

            const wzorOkBtn = document.getElementById('btn-wzor-ok');
            const wzorClearBtn = document.getElementById('btn-wzor-clear');
            const wzorTextarea = document.getElementById('wzor-tekst');
            if (wzorOkBtn) wzorOkBtn.addEventListener('click', applyWzor);
            if (wzorClearBtn) {
                wzorClearBtn.addEventListener('click', () => {
                    if (wzorTextarea) wzorTextarea.value = '';
                    const info = document.getElementById('wzor-info');
                    if (info) info.textContent = '';
                    if (wzorTextarea) wzorTextarea.focus();
                });
            }
        });
    </script>
</body>
</html>
