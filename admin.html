<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel Administracyjny</title>
    <style>
        :root { color-scheme: light dark; }
        html[data-theme="light"] { color-scheme: light; }
        html[data-theme="dark"] { color-scheme: dark; }
        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
            background: Canvas;
            color: CanvasText;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 16px auto;
            padding: 0 16px;
        }
        /* Header styles moved to header.css */
        h1 {
            font-size: 24px;
        }
        .card {
            background: Canvas;
            color: CanvasText;
            border: 1px solid rgba(127,127,127,.25);
            border-radius: 12px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08);
            padding: 24px;
        }
        .btn {
            appearance: none;
            border: 1px solid rgba(127,127,127,.35);
            background: color-mix(in oklab, Canvas 96%, transparent);
            color: CanvasText;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: color-mix(in oklab, Canvas 92%, transparent);
        }
        .btn-primary {
            background: #60a5fa;
            color: white;
            border-color: #60a5fa;
        }
        .btn-primary:hover {
            background: #4a9eff;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        thead th {
            text-align: left;
            font-weight: 600;
            padding: 12px;
            border-bottom: 2px solid rgba(127,127,127,.25);
            background: color-mix(in oklab, Canvas 92%, transparent);
        }
        tbody td {
            padding: 12px;
            border-bottom: 1px solid rgba(127,127,127,.2);
        }
        tbody tr:hover {
            background: color-mix(in oklab, Canvas 96%, transparent);
        }
        .skeleton {
            display: inline-block;
            height: 1em;
            width: 8ch;
            border-radius: 4px;
            background: linear-gradient(90deg, rgba(127,127,127,.15), rgba(127,127,127,.25), rgba(127,127,127,.15));
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: color-mix(in oklab, CanvasText 60%, transparent);
        }
        .toast {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: 16px;
            background: color-mix(in oklab, CanvasText 5%, Canvas);
            color: CanvasText;
            border: 1px solid rgba(127,127,127,.3);
            padding: 12px 18px;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(0,0,0,.15);
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s ease;
            font-size: 14px;
            z-index: 1000;
        }
        .toast.show {
            opacity: 1;
        }
        .user-count {
            font-size: 14px;
            color: color-mix(in oklab, CanvasText 70%, transparent);
            margin-bottom: 20px;
        }
        .date-cell {
            font-size: 13px;
            color: color-mix(in oklab, CanvasText 70%, transparent);
        }
        <link rel="stylesheet" href="/header.css">
    </style>
    <script src="/header.js"></script>
</head>
<body>
    <div class="container">
        <div id="header-container" 
             data-title="Panel Administracyjny" 
             data-crumbs='/ <a href="/">Zamówienia</a> / Użytkownicy'
             data-extra-buttons='<a href="/" class="btn">Powrót do zamówień</a>'>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="margin: 0; font-size: 18px; font-weight: 600;">Użytkownicy</h2>
            </div>
            
            <div class="user-count" id="user-count">
                <span class="skeleton" style="width: 12ch;"></span>
            </div>

            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Nazwa użytkownika</th>
                            <th>Data utworzenia</th>
                            <th>Ostatnia aktywność</th>
                        </tr>
                    </thead>
                    <tbody id="users-table">
                        <tr>
                            <td colspan="3" class="empty-state">
                                <div class="skeleton" style="width: 20ch; margin: 0 auto;"></div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function formatDate(dateString) {
            if (!dateString) return '-';
            try {
                const date = new Date(dateString);
                return date.toLocaleString('pl-PL', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch {
                return dateString;
            }
        }

        async function loadUsers() {
            const tbody = document.getElementById('users-table');
            const userCountEl = document.getElementById('user-count');
            
            try {
                const res = await fetch('/api/users');
                if (!res.ok) {
                    if (res.status === 401) {
                        window.location.href = '/login';
                        return;
                    }
                    throw new Error('HTTP ' + res.status);
                }
                
                const data = await res.json();
                const users = Array.isArray(data.users) ? data.users : [];
                
                // Update count
                userCountEl.textContent = `Łącznie użytkowników: ${users.length}`;
                
                // Clear table
                tbody.innerHTML = '';
                
                if (users.length === 0) {
                    const tr = document.createElement('tr');
                    const td = document.createElement('td');
                    td.colSpan = 3;
                    td.className = 'empty-state';
                    td.textContent = 'Brak użytkowników w systemie.';
                    tr.appendChild(td);
                    tbody.appendChild(tr);
                    return;
                }
                
                // Populate table
                users.forEach(user => {
                    const tr = document.createElement('tr');
                    
                    // Username
                    const tdUsername = document.createElement('td');
                    tdUsername.textContent = user.username || '-';
                    tr.appendChild(tdUsername);
                    
                    // Created date
                    const tdCreated = document.createElement('td');
                    tdCreated.className = 'date-cell';
                    tdCreated.textContent = formatDate(user.createdAt);
                    tr.appendChild(tdCreated);
                    
                    // Last activity (not stored yet, showing created date)
                    const tdActivity = document.createElement('td');
                    tdActivity.className = 'date-cell';
                    tdActivity.textContent = formatDate(user.lastActivity || user.createdAt);
                    tr.appendChild(tdActivity);
                    
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error('Error loading users:', e);
                tbody.innerHTML = '';
                const tr = document.createElement('tr');
                const td = document.createElement('td');
                td.colSpan = 3;
                td.className = 'empty-state';
                td.textContent = 'Nie udało się wczytać użytkowników.';
                tr.appendChild(td);
                tbody.appendChild(tr);
                userCountEl.textContent = 'Błąd ładowania danych';
                showToast('Błąd ładowania użytkowników');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Theme toggle
            const toggle = document.getElementById('light-toggle');
            try {
                const saved = localStorage.getItem('theme');
                if (saved === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                    if (toggle) toggle.checked = true;
                }
            } catch {}

            if (toggle) {
                toggle.addEventListener('change', () => {
                    const isLight = toggle.checked;
                    if (isLight) {
                        document.documentElement.setAttribute('data-theme', 'light');
                        try { localStorage.setItem('theme', 'light'); } catch {}
                    } else {
                        document.documentElement.removeAttribute('data-theme');
                        try { localStorage.removeItem('theme'); } catch {}
                    }
                });
            }

            // Logout handler
            const logoutBtn = document.getElementById('logout-btn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', async () => {
                    try {
                        await fetch('/api/logout', { method: 'POST' });
                        window.location.href = '/login';
                    } catch (e) {
                        console.error('Logout error:', e);
                        window.location.href = '/login';
                    }
                });
            }

            // Load users
            loadUsers();
        });
    </script>
</body>
</html>
