<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel Administracyjny</title>
    <style>
        :root { color-scheme: light dark; }
        html[data-theme="light"] { color-scheme: light; }
        html[data-theme="dark"] { color-scheme: dark; }
        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
            background: Canvas;
            color: CanvasText;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 16px auto;
            padding: 0 16px;
        }
        /* Header styles moved to header.css */
        h1 {
            font-size: 24px;
        }
        .card {
            background: Canvas;
            color: CanvasText;
            border: 1px solid rgba(127,127,127,.25);
            border-radius: 12px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08);
            padding: 24px;
        }
        .btn {
            appearance: none;
            border: 1px solid rgba(127,127,127,.35);
            background: color-mix(in oklab, Canvas 96%, transparent);
            color: CanvasText;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: color-mix(in oklab, Canvas 92%, transparent);
        }
        .btn-primary {
            background: #60a5fa;
            color: white;
            border-color: #60a5fa;
        }
        .btn-primary:hover {
            background: #4a9eff;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 10px;
        }
        thead th {
            text-align: left;
            font-weight: 600;
            padding: 12px;
            border-bottom: 2px solid rgba(127,127,127,.25);
            background: color-mix(in oklab, Canvas 92%, transparent);
        }
        tbody td {
            padding: 12px;
            border-bottom: 1px solid rgba(127,127,127,.2);
        }
        tbody tr:hover {
            background: color-mix(in oklab, Canvas 96%, transparent);
        }
        .skeleton {
            display: inline-block;
            height: 1em;
            width: 8ch;
            border-radius: 4px;
            background: linear-gradient(90deg, rgba(127,127,127,.15), rgba(127,127,127,.25), rgba(127,127,127,.15));
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: color-mix(in oklab, CanvasText 60%, transparent);
        }
        .toast {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: 16px;
            background: color-mix(in oklab, CanvasText 5%, Canvas);
            color: CanvasText;
            border: 1px solid rgba(127,127,127,.3);
            padding: 12px 18px;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(0,0,0,.15);
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s ease;
            font-size: 14px;
            z-index: 1000;
        }
        .toast.show {
            opacity: 1;
        }
        .user-count {
            font-size: 14px;
            color: color-mix(in oklab, CanvasText 70%, transparent);
            margin-bottom: 20px;
        }
        .date-cell {
            font-size: 13px;
            color: color-mix(in oklab, CanvasText 70%, transparent);
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: Canvas;
            color: CanvasText;
            border: 1px solid rgba(127,127,127,.25);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,.2);
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid rgba(127,127,127,.25);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin: 0;
        }
        .modal-close {
            appearance: none;
            border: none;
            background: transparent;
            color: CanvasText;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }
        .modal-close:hover {
            background: color-mix(in oklab, CanvasText 8%, Canvas);
        }
        .modal-body {
            padding: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: CanvasText;
        }
        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid rgba(127,127,127,.35);
            border-radius: 8px;
            background: Canvas;
            color: CanvasText;
            font-size: 14px;
            box-sizing: border-box;
        }
        .form-input:focus {
            outline: none;
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.1);
        }
        .form-help {
            font-size: 12px;
            color: color-mix(in oklab, CanvasText 60%, transparent);
            margin-top: 4px;
        }
        .form-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }
        .btn-secondary {
            background: color-mix(in oklab, Canvas 96%, transparent);
            color: CanvasText;
        }
        .btn-secondary:hover {
            background: color-mix(in oklab, Canvas 92%, transparent);
        }
        .error-message {
            color: #ef4444;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        <link rel="stylesheet" href="/header.css">
    </style>
    <script src="/header.js"></script>
</head>
<body>
    <div class="container">
        <div id="header-container" 
             data-title="Panel Administracyjny" 
             data-crumbs='/ <a href="/">Zamówienia</a> / Użytkownicy'
             data-extra-buttons='<a href="/" class="btn">Powrót do zamówień</a>'>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="margin: 0; font-size: 18px; font-weight: 600;">Użytkownicy</h2>
                <button id="new-user-btn" class="btn btn-primary">+ Nowy użytkownik</button>
            </div>
            
            <div class="user-count" id="user-count">
                <span class="skeleton" style="width: 12ch;"></span>
            </div>

            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Nazwa użytkownika</th>
                            <th>Rola</th>
                            <th>Data utworzenia</th>
                            <th>Ostatnia aktywność</th>
                            <th>Akcje</th>
                        </tr>
                    </thead>
                    <tbody id="users-table">
                        <tr>
                            <td colspan="3" class="empty-state">
                                <div class="skeleton" style="width: 20ch; margin: 0 auto;"></div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- Modal for creating new user -->
    <div id="new-user-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Nowy użytkownik</h3>
                <button class="modal-close" id="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="new-user-form">
                    <div class="form-group">
                        <label class="form-label" for="username">Nazwa użytkownika</label>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            class="form-input" 
                            required 
                            minlength="3"
                            autocomplete="username"
                        >
                        <div class="form-help">Minimum 3 znaki</div>
                        <div class="error-message" id="username-error"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="password">Hasło</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input" 
                            required 
                            minlength="8"
                            autocomplete="new-password"
                        >
                        <div class="form-help">Minimum 8 znaków</div>
                        <div class="error-message" id="password-error"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="password-confirm">Potwierdź hasło</label>
                        <input 
                            type="password" 
                            id="password-confirm" 
                            name="password-confirm" 
                            class="form-input" 
                            required 
                            minlength="8"
                            autocomplete="new-password"
                        >
                        <div class="error-message" id="password-confirm-error"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="role">Rola</label>
                        <select id="role" name="role" class="form-input" required>
                            <option value="przegladajacy">Przeglądający</option>
                            <option value="edytujacy">Edytujący</option>
                            <option value="handlowiec">Handlowiec</option>
                            <option value="moderator">Moderator</option>
                            <option value="produkcja">Produkcja</option>
                            <option value="admin">Admin</option>
                        </select>
                        <div class="form-help">Wybierz rolę dla nowego użytkownika</div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="cancel-btn">Anuluj</button>
                        <button type="submit" class="btn btn-primary">Utwórz użytkownika</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function formatDate(dateString) {
            if (!dateString) return '-';
            try {
                const date = new Date(dateString);
                return date.toLocaleString('pl-PL', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch {
                return dateString;
            }
        }

        async function loadUsers() {
            const tbody = document.getElementById('users-table');
            const userCountEl = document.getElementById('user-count');
            
            try {
                const res = await fetch('/api/users');
                if (!res.ok) {
                    if (res.status === 401) {
                        window.location.href = '/login';
                        return;
                    }
                    throw new Error('HTTP ' + res.status);
                }
                
                const data = await res.json();
                const users = Array.isArray(data.users) ? data.users : [];
                
                // Update count
                userCountEl.textContent = `Łącznie użytkowników: ${users.length}`;
                
                // Clear table
                tbody.innerHTML = '';
                
                if (users.length === 0) {
                    const tr = document.createElement('tr');
                    const td = document.createElement('td');
                    td.colSpan = 5;
                    td.className = 'empty-state';
                    td.textContent = 'Brak użytkowników w systemie.';
                    tr.appendChild(td);
                    tbody.appendChild(tr);
                    return;
                }
                
                // Populate table
                users.forEach(user => {
                    const tr = document.createElement('tr');
                    tr.dataset.userId = user.id;
                    
                    // Username
                    const tdUsername = document.createElement('td');
                    tdUsername.textContent = user.username || '-';
                    tr.appendChild(tdUsername);
                    
                    // Role
                    const tdRole = document.createElement('td');
                    const roleSelect = document.createElement('select');
                    roleSelect.className = 'form-input';
                    roleSelect.style.cssText = 'width: 100%; padding: 6px 8px; font-size: 13px;';
                    roleSelect.dataset.userId = user.id;
                    
                    const roles = [
                        { value: 'admin', label: 'Admin' },
                        { value: 'moderator', label: 'Moderator' },
                        { value: 'handlowiec', label: 'Handlowiec' },
                        { value: 'produkcja', label: 'Produkcja' },
                        { value: 'przegladajacy', label: 'Przeglądający' },
                        { value: 'edytujacy', label: 'Edytujący' }
                    ];
                    
                    roles.forEach(r => {
                        const option = document.createElement('option');
                        option.value = r.value;
                        option.textContent = r.label;
                        if (user.role === r.value) {
                            option.selected = true;
                        }
                        roleSelect.appendChild(option);
                    });
                    
                    roleSelect.addEventListener('change', async () => {
                        await updateUserRole(user.id, roleSelect.value);
                    });
                    
                    tdRole.appendChild(roleSelect);
                    tr.appendChild(tdRole);
                    
                    // Created date
                    const tdCreated = document.createElement('td');
                    tdCreated.className = 'date-cell';
                    tdCreated.textContent = formatDate(user.createdAt);
                    tr.appendChild(tdCreated);
                    
                    // Last activity
                    const tdActivity = document.createElement('td');
                    tdActivity.className = 'date-cell';
                    tdActivity.textContent = formatDate(user.lastActivity || user.createdAt);
                    tr.appendChild(tdActivity);
                    
                    // Actions
                    const tdActions = document.createElement('td');
                    tdActions.style.textAlign = 'center';
                    tr.appendChild(tdActions);
                    
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error('Error loading users:', e);
                tbody.innerHTML = '';
                const tr = document.createElement('tr');
                const td = document.createElement('td');
                td.colSpan = 5;
                td.className = 'empty-state';
                td.textContent = 'Nie udało się wczytać użytkowników.';
                tr.appendChild(td);
                tbody.appendChild(tr);
                userCountEl.textContent = 'Błąd ładowania danych';
                showToast('Błąd ładowania użytkowników');
            }
        }

        function showModal() {
            const modal = document.getElementById('new-user-modal');
            modal.classList.add('show');
            document.getElementById('username').focus();
        }

        function hideModal() {
            const modal = document.getElementById('new-user-modal');
            modal.classList.remove('show');
            // Reset form
            document.getElementById('new-user-form').reset();
            // Clear errors
            document.querySelectorAll('.error-message').forEach(el => {
                el.classList.remove('show');
                el.textContent = '';
            });
        }

        function showError(fieldId, message) {
            const errorEl = document.getElementById(fieldId + '-error');
            if (errorEl) {
                errorEl.textContent = message;
                errorEl.classList.add('show');
            }
        }

        function clearError(fieldId) {
            const errorEl = document.getElementById(fieldId + '-error');
            if (errorEl) {
                errorEl.classList.remove('show');
                errorEl.textContent = '';
            }
        }

        async function updateUserRole(userId, role) {
            try {
                const res = await fetch(`/api/users/${userId}/role`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ role })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || 'Błąd aktualizacji roli');
                }

                if (data.ok) {
                    showToast('Rola została zaktualizowana');
                    loadUsers(); // Reload users list
                } else {
                    throw new Error(data.error || 'Błąd aktualizacji roli');
                }
            } catch (e) {
                console.error('Update role error:', e);
                showToast('Błąd: ' + e.message);
                loadUsers(); // Reload to revert changes
            }
        }

        async function createUser(username, password, role) {
            try {
                const res = await fetch('/api/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, role })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || 'Błąd tworzenia użytkownika');
                }

                if (data.ok) {
                    showToast('Użytkownik został utworzony pomyślnie');
                    hideModal();
                    loadUsers(); // Reload users list
                } else {
                    throw new Error(data.error || 'Błąd tworzenia użytkownika');
                }
            } catch (e) {
                console.error('Create user error:', e);
                showToast('Błąd: ' + e.message);
                if (e.message.includes('już istnieje')) {
                    showError('username', e.message);
                } else if (e.message.includes('Nazwa użytkownika')) {
                    showError('username', e.message);
                } else if (e.message.includes('Hasło')) {
                    showError('password', e.message);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Theme toggle
            const toggle = document.getElementById('light-toggle');
            try {
                const saved = localStorage.getItem('theme');
                if (saved === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                    if (toggle) toggle.checked = true;
                }
            } catch {}

            if (toggle) {
                toggle.addEventListener('change', () => {
                    const isLight = toggle.checked;
                    if (isLight) {
                        document.documentElement.setAttribute('data-theme', 'light');
                        try { localStorage.setItem('theme', 'light'); } catch {}
                    } else {
                        document.documentElement.removeAttribute('data-theme');
                        try { localStorage.removeItem('theme'); } catch {}
                    }
                });
            }

            // Logout handler
            const logoutBtn = document.getElementById('logout-btn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', async () => {
                    try {
                        await fetch('/api/logout', { method: 'POST' });
                        window.location.href = '/login';
                    } catch (e) {
                        console.error('Logout error:', e);
                        window.location.href = '/login';
                    }
                });
            }

            // New user button
            const newUserBtn = document.getElementById('new-user-btn');
            if (newUserBtn) {
                newUserBtn.addEventListener('click', showModal);
            }

            // Modal close buttons
            const closeModalBtn = document.getElementById('close-modal');
            const cancelBtn = document.getElementById('cancel-btn');
            const modal = document.getElementById('new-user-modal');
            
            if (closeModalBtn) {
                closeModalBtn.addEventListener('click', hideModal);
            }
            if (cancelBtn) {
                cancelBtn.addEventListener('click', hideModal);
            }
            if (modal) {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        hideModal();
                    }
                });
            }

            // Form submission
            const form = document.getElementById('new-user-form');
            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    // Clear previous errors
                    clearError('username');
                    clearError('password');
                    clearError('password-confirm');

                    const username = document.getElementById('username').value.trim();
                    const password = document.getElementById('password').value;
                    const passwordConfirm = document.getElementById('password-confirm').value;
                    const role = document.getElementById('role').value;

                    // Validation
                    if (username.length < 3) {
                        showError('username', 'Nazwa użytkownika musi mieć co najmniej 3 znaki');
                        return;
                    }

                    if (password.length < 8) {
                        showError('password', 'Hasło musi mieć co najmniej 8 znaków');
                        return;
                    }

                    if (password !== passwordConfirm) {
                        showError('password-confirm', 'Hasła nie są identyczne');
                        return;
                    }

                    // Create user
                    await createUser(username, password, role);
                });
            }

            // Clear errors on input
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const passwordConfirmInput = document.getElementById('password-confirm');
            
            if (usernameInput) {
                usernameInput.addEventListener('input', () => clearError('username'));
            }
            if (passwordInput) {
                passwordInput.addEventListener('input', () => {
                    clearError('password');
                    clearError('password-confirm');
                });
            }
            if (passwordConfirmInput) {
                passwordConfirmInput.addEventListener('input', () => clearError('password-confirm'));
            }

            // Load users
            loadUsers();
        });
    </script>
</body>
</html>
